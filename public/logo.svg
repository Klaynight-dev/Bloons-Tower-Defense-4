<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Bulle Défense">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/><stop offset=".45" stop-color="#ffd84a"/><stop offset="1" stop-color="#d99400"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8774a"/><stop offset="1" stop-color="#6e4526"/>
    </linearGradient>
    <radialGradient id="shine" cx=".33" cy=".28" r=".85">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </radialGradient>
  </defs>
  <!-- Bouclier : contour sombre, cerclage doré, bois des panneaux du jeu -->
  <path d="M64 4 117 20v42c0 33-23 53-53 63C34 115 11 95 11 62V20z" fill="#4a2a00"/>
  <path d="M64 9 112 23.5V62c0 29.5-20.5 47.5-48 57C36.5 109.5 16 91.5 16 62V23.5z" fill="url(#rim)"/>
  <path d="M64 17 104 29v33c0 24.5-16.5 39.5-40 48-23.5-8.5-40-23.5-40-48V29z" fill="url(#wood)"/>
  <!-- Bulle, dessinée comme dans le jeu -->
  <ellipse cx="60" cy="66" rx="25" ry="29" fill="#e8453c"/>
  <ellipse cx="60" cy="66" rx="25" ry="29" fill="url(#shine)" stroke="#000" stroke-opacity=".45" stroke-width="2"/>
  <path d="M60 94.5 55.5 102h9z" fill="#e8453c" stroke="#000" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="50" cy="52" rx="4.5" ry="8" transform="rotate(-28 50 52)" fill="#fff" opacity=".8"/>
  <!-- Fléchette qui arrive sur la bulle -->
  <g stroke="#4a2a00" stroke-width="2" stroke-linejoin="round">
    <path d="M100 24 94 30H104l4-4z" fill="#2a8fd0"/>
    <path d="M100 24 94 30V20l4-4z" fill="#58b4ec"/>
    <path d="M84 40 98 26" stroke-width="7" stroke-linecap="round"/>
    <path d="M84 40 98 26" stroke="#e08a1e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M77 47 82.5 37.5 86.5 41.5z" fill="#dfe4e9"/>
  </g>
  <!-- Éclats de l'impact -->
  <g stroke="#ffd84a" stroke-width="3" stroke-linecap="round">
    <path d="M72 37l-3-6"/><path d="M87 52l6 2"/><path d="M90 46h6"/>
  </g>
</svg>
